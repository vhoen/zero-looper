<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Looper - Boucler vos vidéos YouTube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .video-container {
            margin-bottom: 30px;
        }

        .video-container iframe,
        .video-container > div {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 8px;
        }

        .loops-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        /* Indicateur visuel lors de l'édition d'une boucle */
        #loopForm.editing {
            border: 2px dashed #ffc107;
            padding: 18px;
            border-radius: 8px;
            position: relative;
            background: #fff9e6;
        }

        #loopForm.editing::before {
            content: 'Édition de boucle';
            position: absolute;
            top: -12px;
            left: 16px;
            background: #ffc107;
            color: #1f1f1f;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.85em;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-left: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .loops-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .loop-button {
            padding: 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .loop-button:hover {
            background: #667eea;
            color: white;
        }

        .loop-button.active {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            border-top: 1px solid #e9ecef;
        }

        .url-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .url-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 0.9em;
            word-break: break-all;
            color: #666;
        }

        .btn-copy {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .error, .success {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .error {
            color: #ff6b6b;
            background: #ffe0e0;
        }

        .success {
            color: #28a745;
            background: #e0ffe0;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .url-section {
                flex-direction: column;
            }

            .btn-copy {
                width: 100%;
            }
        }
        /* Modal confirmation */
        #deleteModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #deleteModal .modal-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        #deleteModal .modal-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-confirm-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔄 Zero Looper</h1>
            <p>Créez des boucles personnalisées dans vos vidéos YouTube</p>
        </div>

        <div class="content">
            <div id="errorMessage" class="error"></div>
            <div id="successMessage" class="success"></div>

            <div class="form-section" style="margin-bottom: 30px;">
                <h2 class="section-title">🎬 Charger une Vidéo YouTube</h2>
                <div class="form-group">
                    <label for="youtubeUrl">URL de la vidéo YouTube</label>
                    <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." required>
                </div>
                <button id="loadVideoBtn" class="btn-add">Charger la vidéo</button>
            </div>

            <div class="video-container">
                <div id="videoPlayer"></div>
            </div>

            <div class="loops-section">
                <h2 class="section-title">🎵 Mes Boucles</h2>
                <div id="loopsList" class="loops-list"></div>
                <div id="emptyState" class="empty-state">
                    <p>Aucune boucle créée. Ajoutez-en une ci-dessous ! 👇</p>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">➕ Ajouter une Boucle</h2>
                <form id="loopForm">
                    <div class="form-group">
                        <label for="loopName">Nom de la boucle</label>
                        <input type="text" id="loopName" placeholder="Ex: Solo guitare" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="loopStart">Début (secondes)</label>
                            <input type="number" id="loopStart" placeholder="0" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="loopEnd">Fin (secondes)</label>
                            <input type="number" id="loopEnd" placeholder="30" min="0" required>
                        </div>
                    </div>
                    <div style="margin-top:12px; display:flex; align-items:center;">
                        <button type="submit" class="btn-add">Ajouter la boucle</button>
                        <button type="button" id="cancelEditBtn" class="btn-cancel" style="display:none;">Annuler</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="footer">
            <h3 class="section-title">🔗 Partagez votre contenu</h3>
            <div class="url-section">
                <input type="text" id="urlDisplay" class="url-input" readonly>
                <button id="copyBtn" class="btn-copy">Copier le lien</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmation de suppression -->
    <div id="deleteModal">
        <div class="modal-box">
            <div id="deleteModalMessage">Voulez-vous supprimer cette boucle ?</div>
            <div class="modal-actions">
                <button id="deleteConfirmBtn" class="btn-confirm-delete">Supprimer</button>
                <button id="deleteCancelBtn" class="btn-cancel">Annuler</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
        // Importer les modules
        import { getYoutubeVideoId } from './src/utils/youtube.js';
        import { createLoop, addLoop, removeLoop, initializeLoopData, updateLoop } from './src/utils/loops.js';
        import { encodeData, decodeData, generateUrl, extractDataFromHash } from './src/utils/encoding.js';

        // ============================================
        // STATE
        // ============================================
        let player;
        let loopData = { url: '', loops: [] };
        let currentLoopName = null;
        let loopInterval = null;
        let playerReady = false;
        let editingIndex = -1;

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener('load', init);

        function init() {
            const hash = window.location.hash.substring(1);
            
            if (hash) {
                try {
                    loopData = extractDataFromHash(hash);
                    if (loopData && loopData.url) {
                        document.getElementById('youtubeUrl').value = loopData.url;
                    }
                    renderLoops();
                    updateUrlDisplay();
                } catch (error) {
                    showError('Format d\'URL invalide. Veuillez vérifier le lien.');
                    console.error('Erreur de décodage:', error);
                }
            } else {
                showError('Veuillez charger une vidéo YouTube ci-dessus.');
            }
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        document.getElementById('loadVideoBtn').addEventListener('click', handleLoadVideo);
        document.getElementById('youtubeUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLoadVideo();
        });

        document.getElementById('loopForm').addEventListener('submit', handleAddLoop);
        document.getElementById('copyBtn').addEventListener('click', handleCopyUrl);
        document.getElementById('cancelEditBtn').addEventListener('click', handleCancelEdit);
        // Modal buttons
        document.getElementById('deleteConfirmBtn').addEventListener('click', confirmDelete);
        document.getElementById('deleteCancelBtn').addEventListener('click', cancelDelete);

        // ============================================
        // FUNCTIONS
        // ============================================
        function handleLoadVideo() {
            const url = document.getElementById('youtubeUrl').value.trim();

            if (!url) {
                showError('Veuillez entrer une URL YouTube.');
                return;
            }

            const videoId = getYoutubeVideoId(url);
            if (!videoId) {
                showError('URL YouTube invalide. Vérifiez le format de l\'URL.');
                return;
            }

            if (!playerReady || !player) {
                showError('Le lecteur n\'est pas prêt. Veuillez attendre quelques secondes et réessayer.');
                return;
            }

            try {
                loopData.url = url;
                loopData.loops = [];

                player.loadVideoById(videoId);
                
                updateUrlDisplay();
                renderLoops();
                showSuccess('Vidéo chargée avec succès !');
            } catch (e) {
                console.error('Erreur lors du chargement de la vidéo:', e);
                showError('Impossible de charger la vidéo. Vérifiez que l\'URL est correcte.');
            }
        }

        function handleAddLoop(e) {
            e.preventDefault();

            const name = document.getElementById('loopName').value.trim();
            const start = parseInt(document.getElementById('loopStart').value);
            const end = parseInt(document.getElementById('loopEnd').value);

            try {
                const loop = createLoop(name, start, end);
                if (editingIndex >= 0) {
                    loopData = updateLoop(loopData, editingIndex, loop);
                    editingIndex = -1;
                    const form = document.getElementById('loopForm');
                    form.classList.remove('editing');
                    document.getElementById('cancelEditBtn').style.display = 'none';
                    document.querySelector('#loopForm button[type="submit"]').textContent = 'Ajouter la boucle';
                    showSuccess('Boucle modifiée avec succès !');
                } else {
                    loopData = addLoop(loopData, loop);
                    showSuccess('Boucle ajoutée avec succès !');
                }

                document.getElementById('loopName').value = '';
                document.getElementById('loopStart').value = '';
                document.getElementById('loopEnd').value = '';

                updateUrlDisplay();
                renderLoops();
            } catch (error) {
                showError(error.message);
            }
        }

        function handleCopyUrl() {
            const url = document.getElementById('urlDisplay').value;
            navigator.clipboard.writeText(url).then(() => {
                showSuccess('Lien copié dans le presse-papiers !');
            });
        }

        function renderLoops() {
            const container = document.getElementById('loopsList');
            const emptyState = document.getElementById('emptyState');
            
            container.innerHTML = '';
            
            if (loopData.loops.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';

            loopData.loops.forEach((loop, index) => {
                const card = document.createElement('div');
                card.style.display = 'flex';
                card.style.flexDirection = 'column';
                card.style.gap = '8px';

                const playBtn = document.createElement('button');
                playBtn.type = 'button';
                playBtn.className = 'loop-button';
                if (currentLoopName === loop.name) playBtn.classList.add('active');
                playBtn.innerHTML = `
                    <div>
                        <div>${loop.name}</div>
                        <div style="font-size: 0.85em; opacity: 0.8;">${loop.start}s - ${loop.end}s</div>
                    </div>
                `;
                playBtn.dataset.index = index;
                const playHandler = () => playLoop(loop, loop.name, index);
                playBtn.addEventListener('click', playHandler);
                playBtn.addEventListener('pointerdown', playHandler);

                const actions = document.createElement('div');
                actions.style.display = 'flex';
                actions.style.justifyContent = 'space-between';

                const editBtn = document.createElement('button');
                editBtn.type = 'button';
                editBtn.textContent = 'Modifier';
                editBtn.style.background = '#ffc107';
                editBtn.style.border = 'none';
                editBtn.style.padding = '8px 12px';
                editBtn.style.borderRadius = '6px';
                editBtn.style.cursor = 'pointer';
                editBtn.onclick = () => {
                    document.getElementById('loopName').value = loop.name;
                    document.getElementById('loopStart').value = loop.start;
                    document.getElementById('loopEnd').value = loop.end;
                    editingIndex = index;
                    const form = document.getElementById('loopForm');
                    form.classList.add('editing');
                    document.getElementById('cancelEditBtn').style.display = 'inline-block';
                    document.querySelector('#loopForm button[type="submit"]').textContent = 'Modifier la boucle';
                    window.scrollTo({ top: form.offsetTop - 20, behavior: 'smooth' });
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.textContent = '✕ Supprimer';
                deleteBtn.setAttribute('data-test', 'delete-btn');
                deleteBtn.style.background = '#ff6b6b';
                deleteBtn.style.border = 'none';
                deleteBtn.style.padding = '8px 12px';
                deleteBtn.style.borderRadius = '6px';
                deleteBtn.style.cursor = 'pointer';
                    deleteBtn.onclick = () => {
                        // Ouvre la modal de confirmation
                        pendingDeleteIndex = index;
                        const modal = document.getElementById('deleteModal');
                        const msg = document.getElementById('deleteModalMessage');
                        msg.textContent = `Voulez-vous supprimer la boucle « ${loop.name} » ?`;
                        modal.style.display = 'flex';
                        // En environnement de test (Cypress), confirmer automatiquement
                        try {
                            if (window && window.Cypress) {
                                // Petite temporisation pour que Cypress puisse observer la modal si besoin
                                setTimeout(() => confirmDelete(), 50);
                            }
                        } catch (e) {
                            // ignore
                        }
                    };

                actions.appendChild(editBtn);
                actions.appendChild(deleteBtn);

                card.appendChild(playBtn);
                card.appendChild(actions);

                container.appendChild(card);
            });
        }

        function playLoop(loop, loopName, index) {
            if (!player || !playerReady) {
                showError('Le lecteur n\'est pas prêt. Veuillez réessayer.');
                // Continuer l'exécution pour permettre le toggle UI même en environnement headless
            }

            if (currentLoopName === loopName) {
                stopLoop();
                return;
            }

            try {
                currentLoopName = loopName;
                try { window.__currentLoopName = currentLoopName; } catch (e) {}

                // Met à jour les classes sur les boutons existants sans rerender
                document.querySelectorAll('#loopsList .loop-button').forEach(btn => {
                    if (btn.dataset.index === String(index)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });

                player.seekTo(loop.start, true);
                
                setTimeout(() => {
                    try {
                        player.playVideo();
                    } catch (e) {
                        console.error('Erreur lors du lancement de la vidéo:', e);
                        showError('Impossible de lancer la vidéo.');
                    }
                }, 100);

                if (loopInterval) clearInterval(loopInterval);

                loopInterval = setInterval(() => {
                    try {
                        if (player && playerReady) {
                            const currentTime = player.getCurrentTime();
                            if (currentTime >= loop.end) {
                                player.seekTo(loop.start, true);
                            }
                        }
                    } catch (e) {
                        console.error('Erreur dans la boucle:', e);
                    }
                }, 200);
            } catch (e) {
                console.error('Erreur lors du démarrage de la boucle:', e);
                showError('Une erreur s\'est produite. Veuillez réessayer.');
            }
        }

        function stopLoop() {
            if (loopInterval) {
                clearInterval(loopInterval);
                loopInterval = null;
            }
            currentLoopName = null;
            try { window.__currentLoopName = null; } catch (e) {}
            // Retirer la classe active sans rerender pour garder l'élément clickable
            document.querySelectorAll('#loopsList .loop-button').forEach(btn => btn.classList.remove('active'));
        }

        // Modal de confirmation de suppression
        let pendingDeleteIndex = -1;

        function confirmDelete() {
            try {
                if (pendingDeleteIndex >= 0) {
                    loopData = removeLoop(loopData, pendingDeleteIndex);
                    // Si on était en édition sur cet index, réinitialiser le formulaire
                    if (editingIndex === pendingDeleteIndex) {
                        editingIndex = -1;
                        const form = document.getElementById('loopForm');
                        form.classList.remove('editing');
                        document.getElementById('cancelEditBtn').style.display = 'none';
                        document.getElementById('loopName').value = '';
                        document.getElementById('loopStart').value = '';
                        document.getElementById('loopEnd').value = '';
                        document.querySelector('#loopForm button[type="submit"]').textContent = 'Ajouter la boucle';
                    }
                    pendingDeleteIndex = -1;
                    updateUrlDisplay();
                    renderLoops();
                    showSuccess('Boucle supprimée');
                }
            } catch (e) {
                showError(e.message);
            } finally {
                document.getElementById('deleteModal').style.display = 'none';
            }
        }

        function cancelDelete() {
            pendingDeleteIndex = -1;
            document.getElementById('deleteModal').style.display = 'none';
            showSuccess('Suppression annulée');
        }

        function handleCancelEdit() {
            editingIndex = -1;
            const form = document.getElementById('loopForm');
            form.classList.remove('editing');
            document.getElementById('loopName').value = '';
            document.getElementById('loopStart').value = '';
            document.getElementById('loopEnd').value = '';
            document.querySelector('#loopForm button[type="submit"]').textContent = 'Ajouter la boucle';
            document.getElementById('cancelEditBtn').style.display = 'none';
            showSuccess('Édition annulée');
        }

        function updateUrlDisplay() {
            const fullUrl = generateUrl(loopData, window.location.origin + window.location.pathname.replace(/index\.html$/, ''));
            document.getElementById('urlDisplay').value = fullUrl;
            window.history.replaceState(null, '', fullUrl);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 4000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = '✓ ' + message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // ============================================
        // YOUTUBE API
        // ============================================
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('videoPlayer', {
                videoId: '',
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });

            const iframe = document.querySelector('#videoPlayer iframe');
            if (iframe) {
                iframe.style.width = '100%';
                iframe.style.height = '500px';
                iframe.style.borderRadius = '8px';
            }
        };

        function onPlayerReady(event) {
            playerReady = true;
            console.log('Lecteur YouTube prêt');
            if (loopData.url) {
                const videoId = getYoutubeVideoId(loopData.url);
                if (videoId) {
                    try {
                        event.target.cueVideoById(videoId);
                    } catch (e) {
                        console.error('Erreur lors de l\'initialisation du lecteur:', e);
                    }
                }
            }
        }

        function onPlayerStateChange(event) {
            // Ignore YouTube player state changes
        }
    </script>
</body>
</html>
